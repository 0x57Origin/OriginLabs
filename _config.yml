title: OriginLabs
description: Hands-on cybersecurity labs, with findings, fixes, and evidence.
url: https://0x57origin.github.io
baseurl: "/OriginLabs"

remote_theme: mmistakes/minimal-mistakes@4.26.2
minimal_mistakes_skin: dark

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

author:
  name: "Mohammad Nazmul"
  bio: "Cybersecurity labs, findings, and fixes."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/0x57Origin"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/mohammad-nazmul-82012127b/"

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - venv/
