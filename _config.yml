title: OriginLabs
description: Hands-on cybersecurity labs, with findings, fixes, and evidence.
remote_theme: just-the-docs/just-the-docs

# Site URL (used for SEO tags and sitemap)
url: https://0x57origin.github.io
baseurl: /References

# Dark mode to match your aesthetic
color_scheme: dark

# Search across all pages
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Show a "table of contents" heading list on each page
heading_anchors: true

# Collapse/expand nav for nested folders
nav_enabled: true

# Link to your repo on every page
aux_links:
  GitHub:
    - https://github.com/0x57Origin/References
  Portfolio:
    - https://0x57origin.vercel.app
aux_links_new_tab: true

# "Edit this page on GitHub" link under each page
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/0x57Origin/References
gh_edit_branch: main
gh_edit_view_mode: tree

# Footer
footer_content: 'OriginLabs. Hands-on security labs.'
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

# Callouts you can use inside any .md (e.g. {: .note } or {: .warning })
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  finding:
    title: Finding
    color: yellow

# Jekyll plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

