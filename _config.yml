title: OriginLabs
description: Hands-on cybersecurity labs, with findings, fixes, and evidence.
url: https://0x57origin.github.io
baseurl: "/OriginLabs"

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

color_scheme: dark
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: false

aux_links:
  GitHub: https://github.com/0x57Origin
  LinkedIn: https://www.linkedin.com/in/mohammad-nazmul-82012127b/
aux_links_new_tab: true

nav_sort: case_insensitive
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"
footer_content: "OriginLabs. Labs run in isolated environments I own."

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - venv/
