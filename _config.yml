theme: jekyll-theme-chirpy

lang: en
timezone: America/Denver

title: OriginLabs
tagline: Hands-on cybersecurity labs, with findings, fixes, and evidence.
description: >-
  Lab writeups covering detection engineering, Windows logging, network
  enumeration, and remediation. All testing runs in isolated environments I own.

url: "https://0x57origin.github.io"
baseurl: "/OriginLabs"

github:
  username: 0x57Origin

social:
  name: Mohammad Nazmul
  email: mohammadnazmuldev@gmail.com
  links:
    - https://github.com/0x57Origin
    - https://www.linkedin.com/in/mohammad-nazmul-82012127b/

theme_mode: dark
avatar: ""

toc: true

comments:
  provider: giscus
  giscus:
    repo: 0x57Origin/OriginLabs
    repo_id: ""
    category: Announcements
    category_id: ""
    mapping: pathname
    strict: "0"
    input_position: bottom
    lazy: "true"

paginate: 10

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - vendor
  - venv
  - node_modules
  - tools
  - "*.md"
